name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: linux-amd64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
  metal:
    # darwin-arm64: the label RUNNERS.md registers for the
    # Apple pool. macos-arm64 is not one it lists, and a job
    # asking for a label no runner advertises queues forever rather than
    # failing — so the repo keeps looking like it has CI on this leg.
    runs-on: darwin-arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features metal
